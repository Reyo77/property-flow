openapi: 3.0.3
info:
  title: 'PropertyFlow API'
  description: 'Everything a mobile or partner app needs: residents, maintenance, amenities, front desk, finance, governance and community engagement.'
  version: 1.0.0
servers:
  -
    url: 'http://property-flow.test'
tags:
  -
    name: Authentication
    description: "\nSign in by exchanging an email and password for a bearer token, then send it on every request\nas `Authorization: Bearer {token}`. Each device gets its own token, which can be listed and\nrevoked. Accounts with two-factor authentication also need a `code` (or `recovery_code`)."
  -
    name: Communities
    description: "\nThe communities you work in (team) or live in (residents). Every other resource is nested\nunder a community: `/communities/{community}/...`."
  -
    name: Property
    description: ''
  -
    name: Residents
    description: "\nThe community's owners and tenants (team only). Each resident comes with their residencies in\nthis community."
  -
    name: Communication
    description: ''
  -
    name: Documents
    description: "\nOnly the documents your role or residency may see are listed. Download a file from its\n`file.download_url` with the same bearer token."
  -
    name: Maintenance
    description: "\nResidents report problems in their units or common areas and follow them to resolution; the\nteam triages them. Residents see only their own units' requests and comments not marked\ninternal."
  -
    name: Amenities
    description: "\nBookable shared spaces. Times of day (`opens_at`, `closes_at`) are in the community's time zone;\nbooking times are UTC instants. Fees are integer cents in the community's currency."
  -
    name: 'Front desk'
    description: "\nPackages, visitors, guest passes, parking permits and incident reports. Residents see their\nown packages and guest passes; the rest is for the front desk and security team."
  -
    name: Finance
    description: "\nA unit's account is the resident's view of what they owe. All amounts are integer cents in\nthe community's currency; a negative balance is a credit."
  -
    name: Governance
    description: "\nOwners vote on ballots, one vote per unit (weighted by unit factor or one-unit-one-vote), or\nappoint a proxy to vote for them. Results appear only once voting closes."
  -
    name: 'Violations and renovations'
    description: "\nBylaw violations escalate on a schedule (courtesy notice, warning, fines); owners see those on\ntheir own units. Owners ask the board before renovating; the decision comes with a letter."
  -
    name: 'Community engagement'
    description: "\nSurveys and quick polls, forms to sign, and the community board. Poll results are shown to\nthose who answered; survey results to the team."
  -
    name: Notifications
    description: "\nYour in-app notifications. `type` says what happened (`package-arrived`,\n`service-request-status-changed`, `announcement-published`, `invoice-overdue`,\n`amenity-booking-status-changed`, `violation-notice-issued`, `architectural-request-decided`);\n`payload` holds the ids to open."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Get a token from <code>POST /api/v1/auth/token</code> with your email, password and a device name, then send it as <code>Authorization: Bearer {token}</code>.'
security:
  -
    default: []
paths:
  /api/v1/auth/token:
    post:
      summary: 'Sign in'
      operationId: signIn
      description: "Returns a new token for this device. Store it securely; it is only shown once. If the\naccount has two-factor authentication and no code is sent, the response is a 422 with\n`code: two_factor_required` — ask for the code and send the request again."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: 1|Z3f...
                  token_type: Bearer
                  user:
                    id: 5
                    name: 'Rita Resident'
                    email: resident@propertyflow.test
                properties:
                  token:
                    type: string
                    example: 1|Z3f...
                  token_type:
                    type: string
                    example: Bearer
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      name:
                        type: string
                        example: 'Rita Resident'
                      email:
                        type: string
                        example: resident@propertyflow.test
        422:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Wrong email or password'
                    type: object
                    example:
                      message: 'These credentials do not match our records.'
                      code: validation_failed
                      errors:
                        email:
                          - 'These credentials do not match our records.'
                    properties:
                      message:
                        type: string
                        example: 'These credentials do not match our records.'
                      code:
                        type: string
                        example: validation_failed
                      errors:
                        type: object
                        properties:
                          email:
                            type: array
                            example:
                              - 'These credentials do not match our records.'
                            items:
                              type: string
                  -
                    description: 'Two-factor code needed'
                    type: object
                    example:
                      message: 'Enter the code from your authenticator app.'
                      code: two_factor_required
                      errors:
                        code:
                          - 'Enter the code from your authenticator app.'
                    properties:
                      message:
                        type: string
                        example: 'Enter the code from your authenticator app.'
                      code:
                        type: string
                        example: two_factor_required
                      errors:
                        type: object
                        properties:
                          code:
                            type: array
                            example:
                              - 'Enter the code from your authenticator app.'
                            items:
                              type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'The account email. Must be a valid email address.'
                  example: resident@propertyflow.test
                password:
                  type: string
                  description: 'The account password.'
                  example: password
                device_name:
                  type: string
                  description: 'A name for this device, shown when listing and revoking tokens. Must not be greater than 100 characters.'
                  example: "Rita's iPhone"
                code:
                  type: string
                  description: 'Required when the account has two-factor authentication: the 6-digit code from the authenticator app. Must not be greater than 10 characters.'
                  example: null
                  nullable: true
                recovery_code:
                  type: string
                  description: "Instead of `code`: one of the account's two-factor recovery codes (each works once). Must not be greater than 50 characters."
                  example: null
                  nullable: true
              required:
                - email
                - password
                - device_name
      security: []
  /api/v1/me:
    get:
      summary: 'Who am I'
      operationId: whoAmI
      description: "The signed-in person, what they can do, and where: `communities` are the ones they work in\nas a team member (empty for residents), `homes` the units they live in or own. `permissions`\nlists the company permissions they hold, so an app can show or hide features."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 5
                    name: 'Rita Resident'
                    email: resident@propertyflow.test
                    company:
                      id: 1
                      name: 'Maple Property Management'
                    role: null
                    permissions: []
                    communities: []
                    homes:
                      -
                        residency_id: 12
                        community:
                          id: 1
                          name: 'Harbour Towers'
                        unit:
                          id: 1
                          label: 'North Tower · 101'
                        type: owner
                        is_primary: true
                        moved_in_on: '2026-03-25'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      name:
                        type: string
                        example: 'Rita Resident'
                      email:
                        type: string
                        example: resident@propertyflow.test
                      company:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Maple Property Management'
                      role:
                        type: string
                        example: null
                        nullable: true
                      permissions:
                        type: array
                        example: []
                      communities:
                        type: array
                        example: []
                      homes:
                        type: array
                        example:
                          -
                            residency_id: 12
                            community:
                              id: 1
                              name: 'Harbour Towers'
                            unit:
                              id: 1
                              label: 'North Tower · 101'
                            type: owner
                            is_primary: true
                            moved_in_on: '2026-03-25'
                        items:
                          type: object
                          properties:
                            residency_id:
                              type: integer
                              example: 12
                            community:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 1
                                name:
                                  type: string
                                  example: 'Harbour Towers'
                            unit:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 1
                                label:
                                  type: string
                                  example: 'North Tower · 101'
                            type:
                              type: string
                              example: owner
                            is_primary:
                              type: boolean
                              example: true
                            moved_in_on:
                              type: string
                              example: '2026-03-25'
      tags:
        - Authentication
  /api/v1/auth/tokens:
    get:
      summary: 'List your tokens'
      operationId: listYourTokens
      description: "Every device signed in to your account, most recently used first. `current` marks the\ntoken making this request."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 12
                      device_name: "Rita's iPhone"
                      current: true
                      last_used_at: '2026-10-02T14:05:00+00:00'
                      created_at: '2026-09-01T09:00:00+00:00'
                    -
                      id: 7
                      device_name: 'Old iPad'
                      current: false
                      last_used_at: '2026-06-11T18:30:00+00:00'
                      created_at: '2026-02-14T10:00:00+00:00'
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 12
                        device_name: "Rita's iPhone"
                        current: true
                        last_used_at: '2026-10-02T14:05:00+00:00'
                        created_at: '2026-09-01T09:00:00+00:00'
                      -
                        id: 7
                        device_name: 'Old iPad'
                        current: false
                        last_used_at: '2026-06-11T18:30:00+00:00'
                        created_at: '2026-02-14T10:00:00+00:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 12
                        device_name:
                          type: string
                          example: "Rita's iPhone"
                        current:
                          type: boolean
                          example: true
                        last_used_at:
                          type: string
                          example: '2026-10-02T14:05:00+00:00'
                        created_at:
                          type: string
                          example: '2026-09-01T09:00:00+00:00'
      tags:
        - Authentication
  '/api/v1/auth/tokens/{token}':
    delete:
      summary: 'Revoke a token'
      operationId: revokeAToken
      description: 'Signs a device out. Use `current` as the id to sign out the device making the request.'
      parameters: []
      responses:
        204:
          description: Revoked
          content:
            text/plain:
              schema:
                type: string
                example: ''
      tags:
        - Authentication
    parameters:
      -
        in: path
        name: token
        description: 'A token id from the list, or `current`.'
        example: current
        required: true
        schema:
          type: string
